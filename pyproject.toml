[project]
name = "tribe-agent"
version = "0.1.0"
description = "Self-hosted community agent for Tribe (coordinator runtime)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.28,<1",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
assistant = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pyjwt[crypto]>=2.9,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
tribe-agent = "tribe_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribe_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "profiles", "docker", "config.example.yaml", "README.md", "Makefile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live Tribe API (set TRIBE_AGENT_BOT_TOKEN / TRIBE_AGENT_USER_ID)",
]
