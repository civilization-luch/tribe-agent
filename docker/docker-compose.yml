services:
  tribe-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["--config", "/workspace/config.yaml", "run"]
    # Provider credentials come from env/secrets (docker/.env), never baked into the image.
    # Well-known providers: ANTHROPIC_API_KEY, OPENAI_API_KEY, ... Custom providers are
    # declared under `opencode.providers` in config.yaml with `{env:VAR}` api keys.
    env_file:
      - .env
    volumes:
      - ./config.yaml:/workspace/config.yaml:ro
      - ./project:/workspace/project
      - ../data:/workspace/data
      # Persists opencode auth.json + sessions. `docker compose down -v` removes it.
      - opencode-sessions:/root/.local/share/opencode

volumes:
  opencode-sessions:
