# tribe-agent config — copy to config.yaml and fill in.
profile: community

data_dir: ./data

community:
  api_url: https://api.tribe.partnr.icu/graphql
  mcp_url: https://mcp.tribe.partnr.icu/mcp
  bot_token: ""            # paste the community bot token (env: TRIBE_AGENT_BOT_TOKEN)
  user_id: ""              # bot user id (env: TRIBE_AGENT_USER_ID)
  communities: []          # empty = every community where the bot is a member

# Fallback working directory when a task has no workspace-bound repository.
project_path: ""

repo:
  root: ./data/repos       # where workspace repositories are cloned
  strategy: shallow        # shallow | full
  update: lazy             # lazy (fetch before task) | interval
  refetch_interval_minutes: 60   # for update: interval — min time between fetches
  default_url: ""          # "single" agent repository — fallback for unbound workspaces
  default_branch: ""       #   (used by executor/announcements when a workspace has no repo)
  git_token: ""            # optional HTTPS token for private repos

concurrency:
  max_runs: 2              # simultaneous coding-runtime runs
  max_queue: 200           # backpressure: stop enqueuing above this

opencode:
  config_dir: ""           # default: packaged opencode templates
  db: ""                   # default: opencode's own DB (~/.local/share/opencode/opencode.db)
  url: ""                  # for `opencode serve` (assistant module)
  password: ""
  model: ""                # e.g. provider/model
  # Custom / OpenAI-compatible providers. API keys are read from env via {env:VAR}.
  providers: {}
  # providers:
  #   myrouter:
  #     npm: "@ai-sdk/openai-compatible"
  #     name: MyRouter
  #     options:
  #       baseURL: https://api.example.com/v1
  #       apiKey: "{env:MYROUTER_API_KEY}"
  #     models:
  #       some/model: { name: some-model }

telegram:
  bot_token: ""
  admin_chat_id: ""

intervals:
  notifications: 60
  announcements: 3600
  support: 120
  run_agent: 60

batch_limits:
  notification: 30
  announcement: 10
  support: 10

# Per-module settings (see profiles/*.yaml for the enabled set).
module_settings:
  classify:
    feedback_workspace_id: ""
  announcements:
    frequency: weekly
    telegram_chat_id: ""
    workspaces: []        # workspace ids to announce feature commits from
                          # (empty: repo.default_url, else project_path)
  executor:
    push: false            # push executor commits to the workspace repository
    push_mode: direct      # direct (push to the bound branch) | branch (feature branch)
    branch_prefix: tribe   # feature-branch prefix for push_mode: branch
    open_pr: false         # open a GitHub PR after a branch push (requires repo.git_token)
    push_comment: true     # comment on the issue after a successful push
    commands:
      lint: ""
      test: ""
  assistant:
    rate_limit: 30
    timeout: 180
  support:
    communities: []        # empty: community.communities
    status: new
    scan_limit: 50
    # Community setting support.agent_enabled wins over this local switch.
    agent_enabled: false
    auto_convert: false    # create an issue for accepted requests
    workspace_id: ""       # default conversion workspace
    dry_run: false         # analyze only, never mutate
    claim_ttl_seconds: 900
